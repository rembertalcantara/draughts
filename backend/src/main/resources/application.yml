spring:
  application:
    name: draughts
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:draughts}}
    username: ${DATABASE_USERNAME:${DB_USER:draughts}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:draughts}}
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

draughts:
  identity:
    # Override in every deployed environment.
    secret: ${DRAUGHTS_IDENTITY_SECRET:dev-only-secret-change-me-dev-only-secret}
    secure-cookie: ${DRAUGHTS_SECURE_COOKIE:false}
  web:
    allowed-origins: ${DRAUGHTS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL:http://localhost:5173}}
  ai:
    threads: 2
    sweep-interval: PT15S
